[package]
name = "viewer-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bev-renderer = { path = "../../crates/bev-renderer" }
bytes.workspace = true
mcap = { workspace = true, features = ["zstd"] }
serde.workspace = true
serde_json.workspace = true
viewer-core = { path = "../../crates/viewer-core" }
viewer-remote-protocol = { path = "../../crates/viewer-remote-protocol" }
viewer-renderer = { path = "../../crates/viewer-renderer" }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
wgpu.workspace = true
js-sys = "0.3"
web-sys = { workspace = true, features = [
    "AbortController", "AbortSignal", "Blob", "CanvasRenderingContext2d", "Document", "Event",
    "File", "FileList", "Headers", "HtmlButtonElement", "HtmlCanvasElement", "HtmlElement",
    "HtmlInputElement", "HtmlSelectElement", "ImageData", "Request", "RequestInit", "RequestMode",
    "Response", "Url", "UrlSearchParams", "Window",
] }
