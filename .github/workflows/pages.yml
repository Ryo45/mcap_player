name: Deploy Web viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/viewer-web/**'
      - 'crates/**'
      - 'config/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    env:
      CARGO_BUILD_JOBS: '2'
      CC_wasm32_unknown_unknown: clang-18
      CXX_wasm32_unknown_unknown: clang++-18
    steps:
      - name: Checkout source without optional LFS artifacts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          lfs: false
      - name: Read Pages URL
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install Wasm build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18
          rustup toolchain install 1.91.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.91.1
      - name: Install Trunk 0.21.14
        env:
          TRUNK_RELEASE: https://github.com/trunk-rs/trunk/releases/download/v0.21.14
        run: |
          mkdir -p "$RUNNER_TEMP/trunk"
          cd "$RUNNER_TEMP/trunk"
          curl --fail --location --retry 3 --remote-name "$TRUNK_RELEASE/trunk-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --retry 3 --remote-name "$TRUNK_RELEASE/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256"
          read -r trunk_checksum < trunk-x86_64-unknown-linux-gnu.tar.gz.sha256
          printf '%s  %s\n' "$trunk_checksum" trunk-x86_64-unknown-linux-gnu.tar.gz | sha256sum --check -
          tar -xzf trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "$RUNNER_TEMP/trunk" >> "$GITHUB_PATH"
      - name: Build static viewer for the Pages base path
        working-directory: apps/viewer-web
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: trunk build --release --locked --public-url "${PAGES_BASE_PATH}/"
      - name: Upload only static application files
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/viewer-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
